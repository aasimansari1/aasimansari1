<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="30%" style="stop-color:#1a0a2e"/>
      <stop offset="60%" style="stop-color:#0d1b3e"/>
      <stop offset="100%" style="stop-color:#003366"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00D9FF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        font-size: 64px;
        font-weight: 800;
        letter-spacing: 4px;
        fill: #00D9FF;
        animation: blink 3s ease-in-out infinite;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        font-size: 20px;
        font-weight: 400;
        fill: #BD00FF;
        letter-spacing: 2px;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </defs>
  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- Glow overlay -->
  <rect width="1200" height="300" fill="url(#glow)"/>
  <!-- Morphing circle blob -->
  <ellipse cx="600" cy="150" rx="200" ry="120" fill="#00D9FF" opacity="0.04" filter="url(#blur)"/>
  <ellipse cx="600" cy="150" rx="120" ry="80" fill="#BD00FF" opacity="0.06" filter="url(#blur)"/>
  <!-- Grid lines for JARVIS effect -->
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#00D9FF" stroke-width="0.3" opacity="0.2"/>
  <line x1="0" y1="240" x2="1200" y2="240" stroke="#00D9FF" stroke-width="0.3" opacity="0.2"/>
  <line x1="0" y1="150" x2="1200" y2="150" stroke="#00D9FF" stroke-width="0.2" opacity="0.1"/>
  <line x1="200" y1="0" x2="200" y2="300" stroke="#00D9FF" stroke-width="0.2" opacity="0.1"/>
  <line x1="1000" y1="0" x2="1000" y2="300" stroke="#00D9FF" stroke-width="0.2" opacity="0.1"/>
  <!-- Corner accents -->
  <polyline points="20,40 20,20 40,20" stroke="#00D9FF" stroke-width="2" fill="none" opacity="0.7"/>
  <polyline points="1160,40 1160,20 1140,20" stroke="#00D9FF" stroke-width="2" fill="none" opacity="0.7"/>
  <polyline points="20,260 20,280 40,280" stroke="#00D9FF" stroke-width="2" fill="none" opacity="0.7"/>
  <polyline points="1160,260 1160,280 1140,280" stroke="#00D9FF" stroke-width="2" fill="none" opacity="0.7"/>
  <!-- Glow behind text -->
  <text x="600" y="155" text-anchor="middle" class="title" filter="url(#blur)" opacity="0.4">MOHD AASIM ANSARI</text>
  <!-- Main title -->
  <text x="600" y="155" text-anchor="middle" class="title">MOHD AASIM ANSARI</text>
  <!-- Subtitle -->
  <text x="600" y="200" text-anchor="middle" class="subtitle">⚡ Full Stack Data Science • Gen AI • Agentic AI ⚡</text>
</svg>
