name: Daily Contribution Activity

on:
  schedule:
    - cron: '30 4 * * *'  # 10:00 AM IST daily
  workflow_dispatch:       # allow manual trigger

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Make daily commits
        run: |
          git config user.name "Mohd Aasim Ansari"
          git config user.email "mohdaasimansari2003@gmail.com"

          DATE=$(date +%Y-%m-%d)
          for i in $(seq 1 20); do
            echo "Daily activity $i - $DATE - $(date +%H:%M:%S)" > daily_log.md
            git add daily_log.md
            git commit -m "activity: daily update $i ($DATE)"
          done

          git push
